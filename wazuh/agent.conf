<!-- Wazuh "default" agent group (manager: /var/ossec/etc/shared/default/agent.conf).
     Every agent in the group receives this; Windows agents do not read Sysmon unless told to. -->
<agent_config os="Windows">
  <!-- Sysmon is not read by default; the built-in Wazuh Sysmon rules need it -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
